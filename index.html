<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STRATOVEX</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#060a12;
    font-family:Arial,sans-serif;
}

#gameCanvas{
    display:block;
    width:100%;
    height:100%;
}

#ui-bar{
    position:fixed;
    top:12px;
    left:12px;
    z-index:20;
    display:flex;
    gap:10px;
}

.stat-box{
    background:rgba(15,23,42,.92);
    color:white;
    padding:9px 13px;
    border:1px solid #334155;
    border-radius:8px;
    font-size:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:6px;
}

#help{
    position:fixed;
    right:12px;
    bottom:12px;
    z-index:20;
    background:rgba(15,23,42,.9);
    color:#cbd5e1;
    padding:9px 12px;
    border-radius:8px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="ui-bar">

    <div class="stat-box">
        <span class="dot" style="background:#38bdf8;"></span>
        Joueur :
        <span id="player-count">1</span>
        cases
    </div>

    <div class="stat-box">
        <span class="dot" style="background:#f43f5e;"></span>
        IA :
        <span id="ai-count">1</span>
        cases
    </div>

</div>

<div id="help">
    Clique sur une case ennemie voisine pour attaquer
</div>

<canvas id="gameCanvas"></canvas>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CONFIG = {

    GRID_SIZE:30,

    TICK_RATE_ECONOMY:500,

    TICK_RATE_AI:800,

    STARTING_TROOPS:20,

    MAX_TROOPS_DEFAULT:100,

    TROOP_REGEN_RATE:0.5,

    FACTIONS:{
        NEUTRAL:0,
        PLAYER:1,
        AI_EASY:2,
        AI_HARD:3
    },

    COLORS:{

        0:{
            bg:'#1e293b',
            border:'#334155',
            text:'#64748b'
        },

        1:{
            bg:'#0284c7',
            border:'#38bdf8',
            text:'#ffffff'
        },

        2:{
            bg:'#be123c',
            border:'#f43f5e',
            text:'#ffffff'
        },

        3:{
            bg:'#7c3aed',
            border:'#a78bfa',
            text:'#ffffff'
        }

    },

    TERRAINS:{

        PLAIN:{
            cost:1,
            defense:1.0,
            maxTroopsMod:1.0
        },

        FOREST:{
            cost:2,
            defense:1.5,
            maxTroopsMod:1.2
        },

        MOUNTAIN:{
            cost:3,
            defense:2.0,
            maxTroopsMod:1.5
        }

    }

};


/* =========================================================
   CARTE / CELLULE
   ========================================================= */

class Cell{

    constructor(x,y){

        this.x=x;

        this.y=y;

        this.owner=
            CONFIG.FACTIONS.NEUTRAL;

        this.troops=5;

        this.maxTroops=
            CONFIG.MAX_TROOPS_DEFAULT;

        this.terrain='PLAIN';

        this.building='NONE';

    }


    draw(ctx){

        const px=
            this.x*CONFIG.GRID_SIZE;

        const py=
            this.y*CONFIG.GRID_SIZE;

        const color=
            CONFIG.COLORS[this.owner];

        let fillBg=color.bg;


        if(
            this.terrain==='FOREST' &&
            this.owner===
            CONFIG.FACTIONS.NEUTRAL
        ){

            fillBg='#14532d';

        }

        else if(
            this.terrain==='MOUNTAIN' &&
            this.owner===
            CONFIG.FACTIONS.NEUTRAL
        ){

            fillBg='#334155';

        }


        ctx.fillStyle=fillBg;

        ctx.fillRect(
            px+1,
            py+1,
            CONFIG.GRID_SIZE-2,
            CONFIG.GRID_SIZE-2
        );


        ctx.strokeStyle=color.border;

        ctx.lineWidth=1;

        ctx.strokeRect(
            px+1,
            py+1,
            CONFIG.GRID_SIZE-2,
            CONFIG.GRID_SIZE-2
        );


        if(this.troops>0){

            ctx.fillStyle=color.text;

            ctx.font='10px Arial';

            ctx.textAlign='center';

            ctx.textBaseline='middle';

            ctx.fillText(
                Math.floor(this.troops),
                px+CONFIG.GRID_SIZE/2,
                py+CONFIG.GRID_SIZE/2
            );

        }

    }

}


/* =========================================================
   GESTIONNAIRE DE CARTE
   ========================================================= */

class MapManager{

    constructor(width,height){

        this.cols=
            Math.floor(
                width/CONFIG.GRID_SIZE
            );

        this.rows=
            Math.floor(
                height/CONFIG.GRID_SIZE
            );

        this.grid=[];

    }


    init(){

        this.grid=[];


        for(
            let x=0;
            x<this.cols;
            x++
        ){

            this.grid[x]=[];


            for(
                let y=0;
                y<this.rows;
                y++
            ){

                const cell=
                    new Cell(x,y);

                const rand=
                    Math.random();


                if(rand<0.08){

                    cell.terrain=
                        'MOUNTAIN';

                    cell.maxTroops=
                        CONFIG.MAX_TROOPS_DEFAULT *
                        CONFIG.TERRAINS.MOUNTAIN.maxTroopsMod;

                }

                else if(rand<0.20){

                    cell.terrain=
                        'FOREST';

                    cell.maxTroops=
                        CONFIG.MAX_TROOPS_DEFAULT *
                        CONFIG.TERRAINS.FOREST.maxTroopsMod;

                }

                else{

                    cell.terrain=
                        'PLAIN';

                    cell.maxTroops=
                        CONFIG.MAX_TROOPS_DEFAULT;

                }


                this.grid[x][y]=cell;

            }

        }


        if(
            this.cols>=5 &&
            this.rows>=5
        ){

            const playerCell=
                this.grid[2][2];

            playerCell.owner=
                CONFIG.FACTIONS.PLAYER;

            playerCell.troops=
                CONFIG.STARTING_TROOPS;


            const aiCell=
                this.grid[
                    this.cols-3
                ][
                    this.rows-3
                ];

            aiCell.owner=
                CONFIG.FACTIONS.AI_EASY;

            aiCell.troops=
                CONFIG.STARTING_TROOPS;

        }

    }


    getNeighbors(x,y){

        const neighbors=[];

        const dirs=[

            [0,-1],

            [0,1],

            [-1,0],

            [1,0]

        ];


        for(
            const [dx,dy] of dirs
        ){

            const nx=x+dx;

            const ny=y+dy;


            if(
                nx>=0 &&
                nx<this.cols &&
                ny>=0 &&
                ny<this.rows
            ){

                neighbors.push(
                    this.grid[nx][ny]
                );

            }

        }


        return neighbors;

    }

}


/* =========================================================
   BÂTIMENTS
   ========================================================= */

class BuildingManager{

    constructor(){

        this.TYPES={

            NONE:{
                name:'Aucun',
                cost:0,
                productionBonus:1.0,
                defenseBonus:1.0
            },

            FACTORY:{
                name:'Usine',
                cost:50,
                productionBonus:2.0,
                defenseBonus:1.2
            },

            TOWER:{
                name:'Tour de Défense',
                cost:40,
                productionBonus:0.5,
                defenseBonus:2.5
            },

            MINE:{
                name:'Mine',
                cost:60,
                productionBonus:1.0,
                defenseBonus:1.0
            }

        };

    }


    build(
        cell,
        buildingKey,
        playerGold
    ){

        const buildingData=
            this.TYPES[buildingKey];


        if(!buildingData){

            return{
                success:false,
                cost:0
            };

        }


        if(
            playerGold>=
            buildingData.cost
        ){

            cell.building=
                buildingKey;


            cell.maxTroops=
                Math.floor(

                    CONFIG.MAX_TROOPS_DEFAULT *

                    CONFIG.TERRAINS[
                        cell.terrain
                    ].maxTroopsMod *

                    buildingData.defenseBonus

                );


            return{
                success:true,
                cost:buildingData.cost
            };

        }


        return{
            success:false,
            cost:0
        };

    }


    getProductionMultiplier(cell){

        if(
            !cell.building ||
            cell.building==='NONE'
        ){

            return 1.0;

        }


        return this.TYPES[
            cell.building
        ].productionBonus;

    }

}


/* =========================================================
   UNITÉS / COMBAT
   ========================================================= */

class UnitManager{

    constructor(buildingManager){

        this.buildingManager=
            buildingManager;

    }


    attack(
        sourceCell,
        targetCell
    ){

        if(
            sourceCell.troops<=1
        ){

            return false;

        }


        if(
            sourceCell.owner===
            targetCell.owner
        ){

            return false;

        }


        const terrainDef=
            CONFIG.TERRAINS[
                targetCell.terrain
            ]
            ?
            CONFIG.TERRAINS[
                targetCell.terrain
            ].defense
            :
            1.0;


        let buildingDef=1.0;


        if(
            targetCell.building &&
            this.buildingManager.TYPES[
                targetCell.building
            ]
        ){

            buildingDef=
                this.buildingManager
                .TYPES[
                    targetCell.building
                ]
                .defenseBonus;

        }


        const totalDefenseMultiplier=
            terrainDef*buildingDef;


        const attackPower=
            Math.floor(
                sourceCell.troops-1
            );


        sourceCell.troops=1;


        const effectiveDefense=
            targetCell.troops*
            totalDefenseMultiplier;


        if(
            attackPower>
            effectiveDefense
        ){

            targetCell.troops=
                Math.floor(
                    attackPower-
                    effectiveDefense
                );


            targetCell.owner=
                sourceCell.owner;


            return true;

        }


        targetCell.troops=
            Math.max(
                0,
                Math.floor(
                    effectiveDefense-
                    attackPower
                )
            );


        return false;

    }


    regenerateTroops(cell){

        if(
            cell.owner===
            CONFIG.FACTIONS.NEUTRAL
        ){

            return;

        }


        let prodBonus=1.0;


        if(
            this.buildingManager &&
            cell.building
        ){

            prodBonus=
                this.buildingManager
                .getProductionMultiplier(
                    cell
                );

        }


        if(
            cell.troops<
            cell.maxTroops
        ){

            cell.troops+=
                CONFIG.TROOP_REGEN_RATE*
                prodBonus;


            if(
                cell.troops>
                cell.maxTroops
            ){

                cell.troops=
                    cell.maxTroops;

            }

        }

    }

}


/* =========================================================
   IA
   ========================================================= */

class AIController{

    constructor(
        factionId,
        mapManager,
        unitManager
    ){

        this.factionId=
            factionId;

        this.mapManager=
            mapManager;

        this.unitManager=
            unitManager;

    }


    makeDecision(){

        const aiCells=[];


        for(
            let x=0;
            x<this.mapManager.cols;
            x++
        ){

            for(
                let y=0;
                y<this.mapManager.rows;
                y++
            ){

                const cell=
                    this.mapManager
                    .grid[x][y];


                if(
                    cell.owner===
                    this.factionId &&
                    cell.troops>15
                ){

                    aiCells.push(cell);

                }

            }

        }


        if(
            aiCells.length===0
        ){

            return;

        }


        aiCells.sort(
            (a,b)=>
                b.troops-a.troops
        );


        const sourceCell=
            aiCells[0];


        const neighbors=
            this.mapManager
            .getNeighbors(
                sourceCell.x,
                sourceCell.y
            );


        const targetable=
            neighbors.filter(
                c=>
                    c.owner!==
                    this.factionId
            );


        if(
            targetable.length===0
        ){

            return;

        }


        targetable.sort(
            (a,b)=>
                a.troops-b.troops
        );


        const targetCell=
            targetable[0];


        this.unitManager.attack(
            sourceCell,
            targetCell
        );

    }

}


/* =========================================================
   MOTEUR DU JEU
   ========================================================= */

class GameEngine{

    constructor(){

        this.canvas=
            document.getElementById(
                'gameCanvas'
            );


        this.ctx=
            this.canvas.getContext(
                '2d'
            );


        this.buildingManager=
            new BuildingManager();


        this.unitManager=
            new UnitManager(
                this.buildingManager
            );


        this.mapManager=
            new MapManager(
                window.innerWidth,
                window.innerHeight
            );


        this.aiController=
            new AIController(
                CONFIG.FACTIONS.AI_EASY,
                this.mapManager,
                this.unitManager
            );


        this.init();

    }


    init(){

        this.resizeCanvas();


        window.addEventListener(
            'resize',
            ()=>{
                this.resizeCanvas();
            }
        );


        this.mapManager.init();


        this.canvas.addEventListener(
            'click',
            e=>{

                this.handlePlayerClick(
                    e.clientX,
                    e.clientY
                );

            }
        );


        this.startLoops();

    }


    resizeCanvas(){

        this.canvas.width=
            window.innerWidth;

        this.canvas.height=
            window.innerHeight;


        this.mapManager.cols=
            Math.max(
                1,
                Math.floor(
                    this.canvas.width/
                    CONFIG.GRID_SIZE
                )
            );


        this.mapManager.rows=
            Math.max(
                1,
                Math.floor(
                    this.canvas.height/
                    CONFIG.GRID_SIZE
                )
            );

    }


    handlePlayerClick(
        clientX,
        clientY
    ){

        const x=
            Math.floor(
                clientX/
                CONFIG.GRID_SIZE
            );


        const y=
            Math.floor(
                clientY/
                CONFIG.GRID_SIZE
            );


        if(
            x<0 ||
            x>=this.mapManager.cols ||
            y<0 ||
            y>=this.mapManager.rows
        ){

            return;

        }


        const targetCell=
            this.mapManager
            .grid[x][y];


        if(
            targetCell.owner===
            CONFIG.FACTIONS.PLAYER
        ){

            return;

        }


        const neighbors=
            this.mapManager
            .getNeighbors(x,y);


        const playerNeighbors=
            neighbors.filter(
                c=>
                    c.owner===
                    CONFIG.FACTIONS.PLAYER &&
                    c.troops>1
            );


        if(
            playerNeighbors.length>0
        ){

            playerNeighbors.sort(
                (a,b)=>
                    b.troops-a.troops
            );


            const sourceCell=
                playerNeighbors[0];


            this.unitManager.attack(
                sourceCell,
                targetCell
            );

        }

    }


    startLoops(){

        setInterval(
            ()=>{

                let playerCount=0;

                let aiCount=0;


                for(
                    let x=0;
                    x<this.mapManager.cols;
                    x++
                ){

                    for(
                        let y=0;
                        y<this.mapManager.rows;
                        y++
                    ){

                        const cell=
                            this.mapManager
                            .grid[x][y];


                        this.unitManager
                            .regenerateTroops(
                                cell
                            );


                        if(
                            cell.owner===
                            CONFIG.FACTIONS.PLAYER
                        ){

                            playerCount++;

                        }


                        if(
                            cell.owner===
                            CONFIG.FACTIONS.AI_EASY
                        ){

                            aiCount++;

                        }

                    }

                }


                const playerElement=
                    document.getElementById(
                        'player-count'
                    );


                const aiElement=document.getElementById('ai-count');


                if(playerElement){

                    playerElement.textContent=
                        playerCount;

                }


                if(aiElement){

                    aiElement.textContent=
                        aiCount;

                }


            },

            CONFIG.TICK_RATE_ECONOMY
        );


        setInterval(
            ()=>{

                this.aiController
                    .makeDecision();

            },

            CONFIG.TICK_RATE_AI
        );


        const renderLoop=()=>{

            this.ctx.clearRect(
                0,
                0,
                this.canvas.width,
                this.canvas.height
            );


            for(
                let x=0;
                x<this.mapManager.cols;
                x++
            ){

                for(
                    let y=0;
                    y<this.mapManager.rows;
                    y++
                ){

                    this.mapManager
                        .grid[x][y]
                        .draw(this.ctx);

                }

            }


            requestAnimationFrame(
                renderLoop
            );

        };


        renderLoop();

    }

}


/* =========================================================
   DÉMARRAGE
   ========================================================= */

window.addEventListener(
    'load',
    ()=>{

        window.game=
            new GameEngine();

        console.log(
            "STRATOVEX chargé !"
        );

    }
);

</script>

</body>
</html>
