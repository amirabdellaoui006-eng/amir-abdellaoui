<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATOVEX - Carte mondiale</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
* {
    box-sizing: border-box;
}

body {
    background: #060a12;
    color: white;
    font-family: Segoe UI, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
}

#hud {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 1000px;
    margin-bottom: 8px;
    background: #0f1724;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid #1e2c40;
}

.hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-group {
    display: flex;
    gap: 15px;
    font-weight: 700;
    font-size: 13px;
}

.controls-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #182538;
    padding: 6px;
    border-radius: 6px;
}

.btn {
    background: #2a3d58;
    color: white;
    border: 1px solid #3d5475;
    padding: 5px 10px;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
}

.btn.active {
    background: #2288ff;
    border-color: #55a3ff;
}

canvas {
    border: 2px solid #1e2c40;
    border-radius: 4px;
    background: #0d1117;
    cursor: crosshair;
    box-shadow: 0 10px 30px rgba(0,0,0,.9);
}

#spawnNotice {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(22,101,216,.95);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    pointer-events: none;
    box-shadow: 0 4px 15px rgba(0,0,0,.5);
    border: 1px solid #55a3ff;
    z-index: 1000;
}

.sliders {
    display: flex;
    gap: 10px;
    align-items: center;
}

.slider {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #ddd;
    font-size: 11px;
}

input[type=range] {
    width: 120px;
}

#loading {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    z-index: 2000;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="loading">🌍 Chargement du monde...</div>

<div id="spawnNotice">
    📍 Clique sur la carte pour choisir ta position de départ !
</div>

<div id="hud">

    <div class="hud-row">

        <div class="stat-group">

            <div>
                💰 Or:
                <span id="goldVal" style="color:#ffd700">200</span>
            </div>

            <div>
                ⚔️ Armées:
                <span id="reserveVal" style="color:#55ff55">300</span>
            </div>

            <div>
                🎨 Ta couleur:
                <span id="myColorDot"
                      style="
                      display:inline-block;
                      width:12px;
                      height:12px;
                      border-radius:2px;
                      vertical-align:middle">
                </span>
            </div>

        </div>

        <div id="actionMsg"
             style="color:#ffcc00;font-weight:700;font-size:13px">
            Choisis ton emplacement de départ !
        </div>

    </div>

    <div class="hud-row">

        <div class="controls-group">

            <span style="font-size:11px;font-weight:700;color:#aaa">
                POURCENTAGE D'ENVOI :
            </span>

            <button class="btn send-btn" data-pct="10">10%</button>
            <button class="btn send-btn" data-pct="25">25%</button>
            <button class="btn send-btn active" data-pct="50">50%</button>
            <button class="btn send-btn" data-pct="100">100%</button>

        </div>

        <div style="font-size:12px;font-weight:700;color:#ffd700">
            Troupes sélectionnées :
            <span id="sendVal" style="color:#fff">150</span>
        </div>

    </div>

    <div class="hud-row">

        <div class="sliders">

            <div class="slider">
                Intensité
                <input id="intensity"
                       type="range"
                       min="0"
                       max="200"
                       value="100">
            </div>

            <div class="slider">
                Montagnes
                <input id="mountainT"
                       type="range"
                       min="0"
                       max="100"
                       value="72">
            </div>

            <div class="slider">
                Plateaux
                <input id="plateauT"
                       type="range"
                       min="0"
                       max="100"
                       value="45">
            </div>

            <div class="slider">
                Côte
                <input id="coastFalloff"
                       type="range"
                       min="2"
                       max="120"
                       value="30">
            </div>

        </div>

        <div style="font-size:12px;color:#aaa">
            STRATOVEX
        </div>

    </div>

</div>

<canvas
    id="gameCanvas"
    width="1000"
    height="500">
</canvas>

<script>

"use strict";

/* =========================================================
   STRATOVEX
   VERSION RÉPARÉE
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const cols = 1000;
const rows = 500;

canvas.width = cols;
canvas.height = rows;


/* =========================================================
   VARIABLES
========================================================= */

let gameStarted = false;

let gold = 200;
let reserveTroops = 300;
let sendPercentage = 50;

let ownersChanged = true;

const world =
    new Uint8Array(cols * rows);

const terrain =
    new Uint8Array(cols * rows);

const owners =
    new Uint8Array(cols * rows);

const elevation =
    new Float32Array(cols * rows);

let activeArmies = [];

let playerColors = {};


/* =========================================================
   COULEURS JOUEURS
========================================================= */

function generateRandomColor() {

    const h = Math.floor(Math.random() * 360);
    const s = 75;
    const l = 50;

    const c =
        (1 - Math.abs(2 * l / 100 - 1)) *
        (s / 100);

    const x =
        c *
        (1 - Math.abs((h / 60) % 2 - 1));

    const m =
        l / 100 - c / 2;

    let r = 0;
    let g = 0;
    let b = 0;

    if (h < 60) {
        r = c;
        g = x;
    }
    else if (h < 120) {
        r = x;
        g = c;
    }
    else if (h < 180) {
        g = c;
        b = x;
    }
    else if (h < 240) {
        g = x;
        b = c;
    }
    else if (h < 300) {
        r = x;
        b = c;
    }
    else {
        r = c;
        b = x;
    }

    return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
    ];
}


function assignColors() {

    playerColors[1] = generateRandomColor();
    playerColors[2] = generateRandomColor();
    playerColors[3] = generateRandomColor();

    document.getElementById("myColorDot")
        .style.background =
        `rgb(${playerColors[1].join(",")})`;
}

assignColors();


/* =========================================================
   PALETTES
========================================================= */

const PALETTES = {

    plain_low: [34, 95, 34],
    plain_high: [190, 227, 150],

    desert_low: [190, 160, 90],
    desert_high: [255, 245, 157],

    mountain_low: [90, 90, 90],
    mountain_high: [245, 245, 245],

    sea_deep: [8, 18, 34],
    sea_shallow: [40, 100, 170]
};


/* =========================================================
   OUTILS
========================================================= */

function lon2x(lon) {

    return Math.floor(
        (lon + 180) / 360 * cols
    );
}


function lat2y(lat) {

    return Math.floor(
        (90 - lat) / 180 * rows
    );
}


function lerp(a, b, t) {

    return a + (b - a) * t;
}


function lerpColor(a, b, t) {

    return [
        Math.round(lerp(a[0], b[0], t)),
        Math.round(lerp(a[1], b[1], t)),
        Math.round(lerp(a[2], b[2], t))
    ];
}


/* =========================================================
   PARAMÈTRES
========================================================= */

const PARAMS = {

    intensity: 1,
    mountainT: 0.72,
    plateauT: 0.45,
    coastFalloff: 30

};


/* =========================================================
   HEIGHTMAP
========================================================= */

const HEIGHTMAP_CANDIDATES = [

    "https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png",

    "https://raw.githubusercontent.com/joanby/fluid-earth/master/data/world_topo_2048.png",

    "https://raw.githubusercontent.com/denoland/deno_website2/master/static/land_ocean_ice_2048.png"

];


/* =========================================================
   GEOJSON
========================================================= */

const GEOJSON_URL =
    "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";


/* =========================================================
   NOISE
========================================================= */

function pseudoNoise(x, y, scale) {

    return (
        Math.sin(x * scale) +
        Math.cos(y * scale) +
        Math.sin((x + y) * scale * .5)
    ) / 3;

}


/* =========================================================
   CHARGER HEIGHTMAP
========================================================= */

async function fetchHeightmap() {

    for (const url of HEIGHTMAP_CANDIDATES) {

        try {

            const img = new Image();

            img.crossOrigin = "anonymous";

            await new Promise((resolve, reject) => {

                img.onload = resolve;

                img.onerror = reject;

                img.src = url;

            });

            console.log(
                "Heightmap chargée :",
                url
            );

            return img;

        }
        catch (error) {

            console.warn(
                "Heightmap impossible à charger",
                url
            );

        }

    }

    return null;
}


/* =========================================================
   CRÉER LE MONDE
========================================================= */

async function buildWorld() {

    let geoLoaded = false;

    try {

        const response =
            await fetch(GEOJSON_URL);

        if (!response.ok) {
            throw new Error(
                "GeoJSON HTTP " +
                response.status
            );
        }

        const geo =
            await response.json();

        const off =
            document.createElement("canvas");

        off.width = cols;
        off.height = rows;

        const octx =
            off.getContext("2d");

        octx.fillStyle = "#000";
        octx.fillRect(
            0,
            0,
            cols,
            rows
        );

        octx.fillStyle = "#fff";

        geo.features.forEach(feature => {

            const geometry =
                feature.geometry;

            if (!geometry)
                return;

            function drawRing(ring) {

                if (!ring.length)
                    return;

                octx.beginPath();

                ring.forEach((point, i) => {

                    const x =
                        lon2x(point[0]);

                    const y =
                        lat2y(point[1]);

                    if (i === 0)
                        octx.moveTo(x, y);
                    else
                        octx.lineTo(x, y);

                });

                octx.closePath();
                octx.fill();

            }

            if (geometry.type === "Polygon") {

                geometry.coordinates
                    .forEach(drawRing);

            }
            else if (
                geometry.type === "MultiPolygon"
            ) {

                geometry.coordinates
                    .forEach(polygon => {

                        polygon.forEach(drawRing);

                    });

            }

        });

        const image =
            octx.getImageData(
                0,
                0,
                cols,
                rows
            ).data;

        for (
            let i = 0;
            i < cols * rows;
            i++
        ) {

            const p = i * 4;

            world[i] =
                image[p] > 128 ? 1 : 0;

        }

        geoLoaded = true;

    }
    catch (error) {

        console.warn(
            "GeoJSON impossible à charger.",
            error
        );

    }


    /* =====================================================
       FALLBACK SI GEOJSON INDISPONIBLE
    ===================================================== */

    if (!geoLoaded) {

        console.log(
            "Création d'une carte de secours."
        );

        for (let y = 0; y < rows; y++) {

            for (let x = 0; x < cols; x++) {

                const nx = x / cols;
                const ny = y / rows;

                const continent =
                    Math.sin(nx * 12) +
                    Math.sin(ny * 8) +
                    Math.sin((nx + ny) * 18);

                world[y * cols + x] =
                    continent > 1.2 ? 1 : 0;

            }

        }

    }


    /* =====================================================
       HEIGHTMAP
    ===================================================== */

    const heightImg =
        await fetchHeightmap();

    if (heightImg) {

        try {

            const hoff =
                document.createElement("canvas");

            hoff.width = cols;
            hoff.height = rows;

            const hctx =
                hoff.getContext("2d");

            hctx.drawImage(
                heightImg,
                0,
                0,
                cols,
                rows
            );

            const data =
                hctx.getImageData(
                    0,
                    0,
                    cols,
                    rows
                ).data;

            for (
                let i = 0;
                i < cols * rows;
                i++
            ) {

                const p = i * 4;

                const gray =
                    (
                        data[p] +
                        data[p + 1] +
                        data[p + 2]
                    ) / 3;

                elevation[i] =
                    gray / 255;

            }

        }
        catch (error) {

            console.warn(
                "Impossible de lire la heightmap."
            );

            createProceduralElevation();

        }

    }
    else {

        createProceduralElevation();

    }


    rebuildTerrain();

    owners.fill(0);

    ownersChanged = true;

}


/* =========================================================
   ÉLÉVATION PROCÉDURALE
========================================================= */

function createProceduralElevation() {

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            const i =
                y * cols + x;

            if (world[i] === 0) {

                elevation[i] = 0;
                continue;

            }

            const noise =
                pseudoNoise(
                    x,
                    y,
                    .015
                );

            const noise2 =
                pseudoNoise(
                    x,
                    y,
                    .04
                );

            let value =
                .5 +
                noise * .25 +
                noise2 * .15;

            elevation[i] =
                Math.max(
                    0,
                    Math.min(
                        1,
                        value
                    )
                );

        }

    }

}


/* =========================================================
   TERRAIN
========================================================= */

function rebuildTerrain() {

    let sum = 0;
    let count = 0;

    for (
        let i = 0;
        i < cols * rows;
        i++
    ) {

        if (world[i] === 1) {

            sum += elevation[i];
            count++;

        }

    }

    const mean =
        count ? sum / count : .5;


    for (
        let i = 0;
        i < cols * rows;
        i++
    ) {

        if (world[i] === 0) {

            terrain[i] = 0;
            continue;

        }

        let value =
            mean +
            (elevation[i] - mean) *
            PARAMS.intensity;

        value =
            Math.max(
                0,
                Math.min(
                    1,
                    value
                )
            );

        elevation[i] = value;

        if (
            value >
            PARAMS.mountainT
        ) {

            terrain[i] = 3;

        }
        else if (
            value >
            PARAMS.plateauT
        ) {

            terrain[i] = 2;

        }
        else {

            terrain[i] = 1;

        }

    }

    ownersChanged = true;

}


/* =========================================================
   SLIDERS
========================================================= */

document.getElementById("intensity")
.addEventListener("input", e => {

    PARAMS.intensity =
        Number(e.target.value) / 100;

    rebuildTerrain();

});


document.getElementById("mountainT")
.addEventListener("input", e => {

    PARAMS.mountainT =
        Number(e.target.value) / 100;

    rebuildTerrain();

});


document.getElementById("plateauT")
.addEventListener("input", e => {

    PARAMS.plateauT =
        Number(e.target.value) / 100;

    rebuildTerrain();

});


document.getElementById("coastFalloff")
.addEventListener("input", e => {

    PARAMS.coastFalloff =
        Number(e.target.value);

    ownersChanged = true;

});


/* =========================================================
   BOUTONS POURCENTAGE
========================================================= */

document
.querySelectorAll(".send-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        sendPercentage =
            Number(
                button.dataset.pct
            );

        document
        .querySelectorAll(".send-btn")
        .forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");

        updateHUD();

    });

});


/* =========================================================
   SPAWN
========================================================= */

function setSpawnArea(
    row,
    col,
    ownerId,
    radius = 8
) {

    for (
        let dr = -radius;
        dr <= radius;
        dr++
    ) {

        for (
            let dc = -radius;
            dc <= radius;
            dc++
        ) {

            const nr =
                row + dr;

            const nc =
                col + dc;

            if (
                nr < 0 ||
                nr >= rows ||
                nc < 0 ||
                nc >= cols
            )
                continue;

            const distance =
                Math.hypot(
                    dr,
                    dc
                );

            if (distance > radius)
                continue;

            const index =
                nr * cols + nc;

            if (world[index] === 1) {

                owners[index] =
                    ownerId;

            }

        }

    }

    ownersChanged = true;

}


/* =========================================================
   BOTS
========================================================= */

function spawnOtherBots(
    playerR,
    playerC
) {

    let spawned = 0;
    let attempts = 0;

    while (
        spawned < 2 &&
        attempts < 3000
    ) {

        attempts++;

        const row =
            Math.floor(
                Math.random() * rows
            );

        const col =
            Math.floor(
                Math.random() * cols
            );

        const index =
            row * cols + col;

        const distance =
            Math.hypot(
                col - playerC,
                row - playerR
            );

        if (
            world[index] === 1 &&
            owners[index] === 0 &&
            distance > 150
        ) {

            setSpawnArea(
                row,
                col,
                spawned === 0 ? 2 : 3,
                6
            );

            spawned++;

        }

    }

}


/* =========================================================
   TROUVER TERRITOIRE
========================================================= */

function findClosestTerritoryPoint(
    targetX,
    targetY,
    ownerId
) {

    let closest = null;
    let minDistance = Infinity;

    for (
        let y = 0;
        y < rows;
        y += 5
    ) {

        for (
            let x = 0;
            x < cols;
            x += 5
        ) {

            const index =
                y * cols + x;

            if (
                owners[index] !== ownerId
            )
                continue;

            const distance =
                Math.hypot(
                    x - targetX,
                    y - targetY
                );

            if (
                distance < minDistance
            ) {

                minDistance = distance;

                closest = {
                    x,
                    y
                };

            }

        }

    }

    return closest;

}


/* =========================================================
   CLIC CARTE
========================================================= */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            Math.floor(
                (event.clientX -
                 rect.left) *
                cols /
                rect.width
            );

        const y =
            Math.floor(
                (event.clientY -
                 rect.top) *
                rows /
                rect.height
            );

        if (
            x < 0 ||
            x >= cols ||
            y < 0 ||
            y >= rows
        )
            return;

        const index =
            y * cols + x;


        /* =========================
           SPAWN
        ========================= */

        if (!gameStarted) {

            if (world[index] === 1) {

                setSpawnArea(
                    y,
                    x,
                    1,
                    8
                );

                spawnOtherBots(
                    y,
                    x
                );

                gameStarted = true;

                document
                .getElementById(
                    "spawnNotice"
                )
                .style.display = "none";

                document
                .getElementById(
                    "actionMsg"
                )
                .innerText =
                    "🎮 Partie lancée !";

                document
                .getElementById(
                    "actionMsg"
                )
                .style.color =
                    "#88a0bc";

                updateHUD();

            }
            else {

                document
                .getElementById(
                    "actionMsg"
                )
                .innerText =
                    "⚠️ Choisis une zone terrestre !";

                document
                .getElementById(
                    "actionMsg"
                )
                .style.color =
                    "#ff4444";

            }

            return;
        }


        /* =========================
           ATTAQUE
        ========================= */

        if (
            world[index] === 1 &&
            owners[index] !== 1
        ) {

            const start =
                findClosestTerritoryPoint(
                    x,
                    y,
                    1
                );

            if (!start)
                return;

            let amount =
                Math.floor(
                    reserveTroops *
                    sendPercentage /
                    100
                );

            amount =
                Math.max(
                    1,
                    amount
                );

            if (
                amount >
                reserveTroops
            ) {

                amount =
                    reserveTroops;

            }

            if (amount <= 0)
                return;

            reserveTroops -= amount;

            activeArmies.push({

                x: start.x + .5,
                y: start.y + .5,

                targetX: x + .5,
                targetY: y + .5,

                count: amount,

                owner: 1

            });

            document
            .getElementById(
                "actionMsg"
            )
            .innerText =
                `⚔️ ${amount} troupes envoyées !`;

            ownersChanged = true;

            updateHUD();

        }

    }
);


/* =========================================================
   ARMÉES
========================================================= */

function updateArmies() {

    for (
        let i = activeArmies.length - 1;
        i >= 0;
        i--
    ) {

        const army =
            activeArmies[i];

        const x =
            Math.floor(army.x);

        const y =
            Math.floor(army.y);

        if (
            x < 0 ||
            x >= cols ||
            y < 0 ||
            y >= rows
        ) {

            activeArmies.splice(i, 1);
            continue;

        }

        const index =
            y * cols + x;

        const terrainType =
            terrain[index] || 1;

        let speed = 0.9;

        if (terrainType === 2)
            speed *= .7;

        if (terrainType === 3)
            speed *= .35;

        const dx =
            army.targetX -
            army.x;

        const dy =
            army.targetY -
            army.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (
            distance > .8 &&
            army.count > 0
        ) {

            army.x +=
                dx / distance *
                speed;

            army.y +=
                dy / distance *
                speed;

            const newX =
                Math.floor(army.x);

            const newY =
                Math.floor(army.y);

            if (
                newX >= 0 &&
                newX < cols &&
                newY >= 0 &&
                newY < rows
            ) {

                const newIndex =
                    newY * cols +
                    newX;

                if (
                    world[newIndex] === 1 &&
                    owners[newIndex] !== army.owner
                ) {

                    owners[newIndex] =
                        army.owner;

                    /*
                       Au lieu de perdre 1 soldat
                       par pixel, on utilise une
                       petite quantité proportionnelle
                       à la taille de l'armée.
                    */

                    const loss =
                        Math.max(
                            1,
                            Math.floor(
                                army.count * .01
                            )
                        );

                    army.count -= loss;

                    ownersChanged = true;

                }

            }

        }
        else {

            activeArmies.splice(i, 1);

        }

        if (army.count <= 0) {

            activeArmies.splice(i, 1);

        }

    }

}


/* =========================================================
   ÉCONOMIE
========================================================= */

function countTerritory(ownerId) {

    let count = 0;

    for (
        let i = 0;
        i < cols * rows;
        i++
    ) {

        if (
            owners[i] === ownerId
        )
            count++;

    }

    return count;

}


setInterval(() => {

    if (!gameStarted)
        return;

    const territory =
        countTerritory(1);

    reserveTroops +=
        Math.max(
            3,
            Math.floor(
                territory * .05
            )
        );

    gold +=
        Math.max(
            1,
            Math.floor(
                territory * .02
            )
        );

    updateHUD();

}, 1000);


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document
    .getElementById("goldVal")
    .innerText =
        Math.floor(gold);

    document
    .getElementById("reserveVal")
    .innerText =
        Math.floor(reserveTroops);

    document
    .getElementById("sendVal")
    .innerText =
        Math.floor(
            reserveTroops *
            sendPercentage /
            100
        );

}


/* =========================================================
   RENDU
========================================================= */

const imgData =
    ctx.createImageData(
        cols,
        rows
    );

const data =
    imgData.data;


function rebuildImageData() {

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            const index =
                y * cols + x;

            const p =
                index * 4;


            /* =====================
               TERRE
            ===================== */

            if (world[index] === 1) {

                let color;


                /*
                   IMPORTANT :
                   On affiche maintenant
                   la couleur du propriétaire.
                */

                if (
                    owners[index] !== 0 &&
                    playerColors[
                        owners[index]
                    ]
                ) {

                    const ownerColor =
                        playerColors[
                            owners[index]
                        ];

                    const elev =
                        elevation[index];

                    const brightness =
                        .75 +
                        elev * .25;

                    color = [
                        Math.min(
                            255,
                            ownerColor[0] *
                            brightness
                        ),

                        Math.min(
                            255,
                            ownerColor[1] *
                            brightness
                        ),

                        Math.min(
                            255,
                            ownerColor[2] *
                            brightness
                        )
                    ];

                }
                else {

                    const elev =
                        elevation[index];

                    const type =
                        terrain[index] || 1;

                    if (type === 1) {

                        color =
                            lerpColor(
                                PALETTES.plain_low,
                                PALETTES.plain_high,
                                elev
                            );

                    }
                    else if (type === 2) {

                        const t =
                            Math.max(
                                0,
                                Math.min(
                                    1,
                                    (
                                        elev -
                                        PARAMS.plateauT
                                    ) /
                                    (
                                        1 -
                                        PARAMS.plateauT
                                    )
                                )
                            );

                        color =
                            lerpColor(
                                PALETTES.desert_low,
                                PALETTES.desert_high,
                                t
                            );

                    }
                    else {

                        const t =
                            Math.max(
                                0,
                                Math.min(
                                    1,
                                    (
                                        elev -
                                        PARAMS.mountainT
                                    ) /
                                    (
                                        1 -
                                        PARAMS.mountainT
                                    )
                                )
                            );

                        color =
                            lerpColor(
                                PALETTES.mountain_low,
                                PALETTES.mountain_high,
                                t
                            );

                    }

                }


                data[p] =
                    Math.round(color[0]);

                data[p + 1] =
                    Math.round(color[1]);

                data[p + 2] =
                    Math.round(color[2]);

                data[p + 3] = 255;

            }


            /* =====================
               MER
            ===================== */

            else {

                const depth =
                    Math.min(
                        1,
                        y / rows
                    );

                const sea =
                    lerpColor(
                        PALETTES.sea_shallow,
                        PALETTES.sea_deep,
                        depth
                    );

                data[p] =
                    sea[0];

                data[p + 1] =
                    sea[1];

                data[p + 2] =
                    sea[2];

                data[p + 3] =
                    255;

            }

        }

    }

    ownersChanged = false;

}


/* =========================================================
   DESSIN
========================================================= */

function draw() {

    updateArmies();

    if (ownersChanged) {

        rebuildImageData();

    }

    ctx.putImageData(
        imgData,
        0,
        0
    );


    /* ARMÉES */

    activeArmies.forEach(army => {

        const x =
            Math.floor(army.x);

        const y =
            Math.floor(army.y);

        const color =
            playerColors[
                army.owner
            ] || [255,255,255];


        /*
           Ombre
        */

        ctx.fillStyle =
            "#000";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
           Soldat
        */

        ctx.fillStyle =
            `rgb(
                ${color[0]},
                ${color[1]},
                ${color[2]}
            )`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });


    requestAnimationFrame(draw);

}


/* =========================================================
   DÉMARRAGE
========================================================= */

async function startGame() {

    try {

        await buildWorld();

        document
        .getElementById("loading")
        .classList.add("hidden");

        updateHUD();

        draw();

        console.log(
            "🌍 STRATOVEX prêt !"
        );

    }
    catch (error) {

        console.error(
            "Erreur critique :",
            error
        );

        document
        .getElementById("loading")
        .innerText =
            "❌ Impossible de charger la carte.";

    }

}


startGame();

</script>
